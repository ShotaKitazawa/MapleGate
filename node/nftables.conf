table inet gamevpn {
  chain forward {
    type filter hook forward priority 0; policy drop;
    iifname "wg0" accept
    oifname "wg0" ct state established,related accept
  }
}

table ip gamevpn_nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    iifname "wg0" oifname != "wg0" masquerade
  }
}
